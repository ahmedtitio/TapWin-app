# ============================================================
# Codemagic CI/CD configuration for "Tap Win" (tap.win.app)
# Repo: https://github.com/ahmedtitio/TapWin-app
#
# Required env. variables (set in Codemagic UI, Instance-based):
#   CM_KEYSTORE            – base64 of release keystore:
#                            base64 -w0 tapwin-release.jks
#   CM_KEYSTORE_PASSWORD   – keystore password
#   CM_KEY_ALIAS           – key alias  (tapwin-key)
#   CM_KEY_PASSWORD        – key password
# Optional instance vars (defaults are baked in below):
#   API_BASE_URL           – Cloudflare Worker URL
#   GA_MEASUREMENT_ID      – GA4 id (G-XXXXXXXXXX)
#   GOOGLE_WEB_CLIENT_ID   – Firebase OAuth Web client id
# ============================================================

workflows:
  tap-win-android:
    name: Tap Win Android (Release APK + AAB)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "tap.win.app"
        API_BASE_URL: "https://app-backend-api.tapwin.workers.dev"
        GA_MEASUREMENT_ID: "G-9HBP87R04M"
        GOOGLE_WEB_CLIENT_ID: "777921904281-9udm9ghsbn7r2f5dpu9h8a1sem2rq73u.apps.googleusercontent.com"
    scripts:
      - name: Set up Android SDK
        script: |
          echo "ANDROID_SDK_ROOT=$CM_ANDROID_HOME" >> $CM_ENV
          echo "ANDROID_HOME=$CM_ANDROID_HOME" >> $CM_ENV
      - name: Decode release keystore
        script: |
          if [ -z "$CM_KEYSTORE" ]; then
            echo "CM_KEYSTORE is not set – see comments at top of codemagic.yaml"; exit 1;
          fi
          echo "$CM_KEYSTORE" | tr -d ' \n\r' | base64 --decode > $CM_BUILD_DIR/release.keystore
          if [ ! -s $CM_BUILD_DIR/release.keystore ]; then echo "ERROR: decoded keystore is empty"; exit 1; fi
          # sanity check: must be a valid JKS/PKCS12 keystore
          keytool -list -keystore $CM_BUILD_DIR/release.keystore -storepass "$CM_KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || { echo "ERROR: invalid keystore or wrong CM_KEYSTORE_PASSWORD"; exit 1; }
          echo "Keystore OK"
      - name: Build Release APK + AAB
        script: |
          # make vars available & visible to all following steps
          for v in API_BASE_URL GA_MEASUREMENT_ID GOOGLE_WEB_CLIENT_ID CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            eval "echo \"$v=${!v}\"" >> $CM_ENV
          done
          cd $CM_CLONE_DIR/android-app
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -PAPI_BASE_URL="$API_BASE_URL" \
            -PGA_MEASUREMENT_ID="$GA_MEASUREMENT_ID" \
            -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            -Pandroid.injected.signing.store.file=$CM_BUILD_DIR/release.keystore \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
      - name: Stage artifacts
        script: |
          mkdir -p $CM_BUILD_DIR/output
          cp android-app/app/build/outputs/apk/release/app-release.apk \
             $CM_BUILD_DIR/output/TapWin-latest.apk
          cp android-app/app/build/outputs/bundle/release/app-release.aab \
             $CM_BUILD_DIR/output/TapWin-latest.aab
          ls -la $CM_BUILD_DIR/output
    artifacts:
      - output/*.apk
      - output/*.aab
      - android-app/app/build/outputs/**
      - android-app/app/build/reports/**
    publishing:
      email:
        recipients:
          - ahmedtitio@gmail.com
